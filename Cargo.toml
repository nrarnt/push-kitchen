[package]
name = "push-kitchen"
version = "0.1.0"
edition = "2024"

[dependencies]
# "wav" lets Bevy play the .wav files in assets/sounds.
bevy = { version = "0.19", features = ["wav"] }

# Our own code: light optimisation, so recompiles stay fast.
[profile.dev]
opt-level = 1

# Dependencies (Bevy): full optimisation. Compiled once, then cached.
[profile.dev.package."*"]
opt-level = 3
