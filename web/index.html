<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Push Kitchen</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a21;
      color: #e8e8ee;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The game's view is 800 x 720. This box is the biggest one of that
       shape that fits the window, and the game fills it. */
    #stage {
      position: relative;
      width: min(100vw, 100vh * 800 / 720);
      height: min(100vh, 100vw * 720 / 800);
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" tabindex="0"></canvas>
    <p id="loading">Setting up the kitchen…</p>
  </div>

  <script type="module">
    import init from "./push-kitchen.js";

    // Browsers keep sound switched off until the visitor presses a key or
    // clicks. The game opens its sound output before that, so remember every
    // output it opens and switch them on at the first key press or click.
    const outputs = [];
    window.AudioContext = new Proxy(window.AudioContext, {
      construct(target, args) {
        const output = new target(...args);
        outputs.push(output);
        return output;
      },
    });
    for (const event of ["keydown", "click", "touchend"]) {
      document.addEventListener(event, () => {
        for (const output of outputs) {
          if (output.state === "suspended") output.resume();
        }
      });
    }

    const canvas = document.getElementById("game");
    const loading = document.getElementById("loading");

    try {
      await init();
    } catch (error) {
      // Bevy leaves its start-up code by throwing this on purpose. Anything
      // else is a real problem.
      if (!String(error).includes("Using exceptions for control flow")) {
        loading.textContent = "The game could not start. This browser may not support WebGL 2.";
        throw error;
      }
    }
    loading.remove();

    // The game only hears the keyboard while its canvas has the focus.
    // Nothing else on the page needs it, so take it back whenever it is
    // lost, for instance by a click beside the game.
    canvas.focus();
    canvas.addEventListener("blur", () => setTimeout(() => canvas.focus(), 0));
  </script>
</body>
</html>
